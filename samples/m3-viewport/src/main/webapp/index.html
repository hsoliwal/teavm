<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>M3 Java / TeaVM Native Panel Proof</title>
    <style>
      :root { font: 15px system-ui, sans-serif; color-scheme: light dark; }
      body { margin: 0; background: #101820; color: #e8f0f6; }
      #m3-root { max-width: 1000px; margin: 2rem auto; padding: 1rem; }
      h1 { font-size: 1.8rem; }
      .controls { display: flex; flex-wrap: wrap; gap: .65rem; padding: .6rem 0; }
      button { padding: .55rem 1rem; border: 1px solid #6b8598; color: inherit;
        background: #26394a; border-radius: 7px; cursor: pointer; }
      button:focus-visible { outline: 3px solid #8ed8ff; outline-offset: 2px; }
      .panel { border: 1px solid #4c687f; border-radius: 10px; padding: 1rem;
        margin-top: 1rem; background: #172633; }
      .viewport { position: relative; overflow: hidden; border: 1px solid #667b8d;
        background: #03090f; max-width: 100%; }
      .remote-content { position: absolute; display: grid; place-items: center;
        box-sizing: border-box; border: 2px dashed #68abbc; background: #223848;
        color: #e7edf4; font-size: 14px; text-align: center; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
    <script src="js/m3-viewport.js" charset="utf-8"></script>
  </head>
  <body onload="main()">
    <main id="m3-root">
      <h1>M3 Java viewport</h1>
      <p>Compile this sample with TeaVM to enable Java-owned panels.</p>
    </main>
  </body>
</html>
